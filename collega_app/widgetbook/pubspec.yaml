name: collega_widgetbook
description: "Catalogue Collega UI (Widgetbook) — tokens et composants, story 8.1+."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  widgetbook: ^3.15.0
  collega_app:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # La police de l'app, déclarée ici aussi : les polices d'un paquet racine ne
  # sont pas exposées à ceux qui en dépendent.
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: ../assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: ../assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: ../assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: ../assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
