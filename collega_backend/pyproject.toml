[tool.poetry]
name = "collega-backend"
version = "0.1.0"
description = "Collega backend — FastAPI + PostgreSQL + ARQ"
authors = ["Matthis Lesur <contact@matthislesur.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = "^0.141.1"
uvicorn = { extras = ["standard"], version = "^0.53.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.54" }
asyncpg = "^0.31.0"
alembic = "^1.20.0"
arq = "^0.28.0"
anthropic = "^1.8.0"
aioapns = "^4.0"
pydantic-settings = "^2.15.0"
email-validator = "^2.3.0"
python-jose = { extras = ["cryptography"], version = "^3.5.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = ">=3.2.0,<4.0.0"
httpx = "^0.28.1"
python-multipart = "^0.0.32"
slowapi = "^0.1.10"
redis = "^5.3.1"
pdfplumber = "^0.11.10"
pytesseract = "^0.3.13"
pdf2image = "^1.17.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
aiosqlite = "^0.22.1"
ruff = "^0.14.0"
mypy = "^1.18.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["pg: nécessite le Postgres de test (docker-compose.test.yml)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
