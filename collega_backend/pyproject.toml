[tool.poetry]
name = "collega-backend"
version = "0.1.0"
description = "AppMédecine backend — FastAPI + PostgreSQL + ARQ"
authors = ["Lesurmatthis <jerome.lesur@astraga.fr>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.115.0"
uvicorn = { extras = ["standard"], version = ">=0.30.0" }
sqlalchemy = { extras = ["asyncio"], version = ">=2.0.0" }
asyncpg = ">=0.29.0"
alembic = ">=1.13.0"
arq = ">=0.25.0"
anthropic = ">=0.25.0"
aioapns = ">=3.0.0"
pydantic-settings = ">=2.0.0"
email-validator = ">=2.0.0"
python-jose = { extras = ["cryptography"], version = ">=3.3.0" }
passlib = { extras = ["bcrypt"], version = ">=1.7.4" }
bcrypt = ">=3.2.0,<4.0.0"
httpx = ">=0.27.0"
python-multipart = ">=0.0.9"
slowapi = ">=0.1.9"
pdfplumber = ">=0.11.0"
pytesseract = ">=0.3.10"
pdf2image = ">=1.17.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
httpx = ">=0.27.0"
pytest-cov = ">=5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
