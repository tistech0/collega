<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppMédecine — Interface Testeur</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f8faf9; color: #1a1c1a; min-height: 100vh; }
    header { background: #1b6b3a; color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    #logout-btn { background: transparent; border: 1px solid rgba(255,255,255,.5); color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: .875rem; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    section { display: none; }
    section.active { display: block; }

    /* Login */
    #login-section { max-width: 360px; margin: 80px auto; }
    .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card h2 { font-size: 1.1rem; margin-bottom: 16px; }
    label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: 4px; margin-top: 12px; }
    input[type=text], input[type=password], select {
      width: 100%; padding: 10px 12px; border: 1px solid #d1d9d2; border-radius: 8px; font-size: .9rem;
      background: #fff; outline: none; transition: border-color .15s;
    }
    input:focus, select:focus { border-color: #1b6b3a; }
    .btn-primary { display: block; width: 100%; margin-top: 20px; padding: 12px; background: #1b6b3a; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn-primary:hover { background: #155530; }
    .btn-primary:disabled { background: #9dbdac; cursor: not-allowed; }
    .error-msg { color: #ba1a1a; font-size: .875rem; margin-top: 8px; }

    /* College list */
    .college-grid { display: grid; gap: 12px; margin-top: 16px; }
    .college-card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); cursor: pointer; border: 2px solid transparent; transition: border-color .15s; display: flex; justify-content: space-between; align-items: center; }
    .college-card:hover { border-color: #1b6b3a; }
    .college-card h3 { font-size: .95rem; font-weight: 600; }
    .college-card p { font-size: .8rem; color: #555; margin-top: 2px; }
    .badge { padding: 2px 8px; border-radius: 99px; font-size: .75rem; font-weight: 600; }
    .badge-green { background: #b7f2c8; color: #1b6b3a; }
    .badge-grey { background: #e5e7e5; color: #555; }

    /* Card viewer */
    #back-btn { background: transparent; border: none; color: #1b6b3a; font-size: .875rem; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-bottom: 16px; padding: 0; }
    #progress-bar-wrap { margin-bottom: 20px; }
    #progress-text { font-size: .8rem; color: #555; margin-bottom: 4px; }
    #progress-bar { height: 6px; background: #e5e7e5; border-radius: 3px; overflow: hidden; }
    #progress-fill { height: 100%; background: #1b6b3a; border-radius: 3px; transition: width .3s; }

    .flash-card-box { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; min-height: 220px; position: relative; }
    .rang-badge { position: absolute; top: 16px; right: 16px; }
    .rang-A { background: #b7f2c8; color: #1b6b3a; }
    .rang-B { background: #b7e8df; color: #3d6b5e; }
    .rang-C { background: #e5e7e5; color: #555; }
    .low-conf-badge { position: absolute; top: 44px; right: 16px; background: #fff3cd; color: #856404; padding: 2px 8px; border-radius: 99px; font-size: .7rem; font-weight: 600; border: 1px solid #ffc107; }
    .card-type-label { font-size: .75rem; color: #888; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .card-recto { font-size: 1.05rem; font-weight: 600; line-height: 1.5; }
    .card-verso { font-size: .95rem; color: #333; line-height: 1.6; margin-top: 16px; padding-top: 16px; border-top: 1px solid #e5e7e5; }
    .card-verso.hidden { display: none; }
    #reveal-hint { text-align: center; font-size: .8rem; color: #888; margin-top: 12px; }

    .feedback-actions { display: flex; gap: 12px; margin-top: 8px; }
    .btn-pertinent { flex: 1; padding: 14px; background: #1b6b3a; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn-pertinent:hover { background: #155530; }
    .btn-not-pertinent { flex: 1; padding: 14px; background: #ba1a1a; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn-not-pertinent:hover { background: #9a1515; }
    .btn-skip { flex: 0 0 auto; padding: 14px 20px; background: transparent; color: #555; border: 1px solid #d1d9d2; border-radius: 8px; font-size: .875rem; cursor: pointer; }

    .already-evaluated { background: #f0faf4; border: 1px solid #b7f2c8; border-radius: 8px; padding: 12px 16px; font-size: .875rem; color: #1b6b3a; margin-bottom: 12px; }

    /* Summary */
    #summary-section table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-top: 12px; }
    th, td { padding: 10px 14px; text-align: left; font-size: .875rem; border-bottom: 1px solid #f0f0f0; }
    th { background: #f8faf9; font-weight: 600; color: #555; }
    .pct { color: #1b6b3a; font-weight: 600; }
    .loader { text-align: center; color: #888; padding: 40px; }
    .empty-state { text-align: center; padding: 48px 16px; color: #888; }
    .empty-state h3 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
  </style>
</head>
<body>

<header>
  <h1>AppMédecine — Interface Testeur</h1>
  <button id="logout-btn" onclick="logout()" style="display:none">Déconnexion</button>
</header>

<main>

  <!-- LOGIN -->
  <section id="login-section" class="active">
    <div class="card">
      <h2>Connexion Testeur</h2>
      <label for="username">Identifiant</label>
      <input type="text" id="username" autocomplete="username" placeholder="tester">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" autocomplete="current-password">
      <div id="login-error" class="error-msg" style="display:none"></div>
      <button class="btn-primary" id="login-btn" onclick="login()">Se connecter</button>
    </div>
  </section>

  <!-- COLLEGE LIST -->
  <section id="colleges-section">
    <h2 style="font-size:1.1rem; margin-bottom:4px">Collèges disponibles</h2>
    <p style="font-size:.875rem; color:#555; margin-bottom:16px">Sélectionnez un collège pour commencer l'évaluation.</p>
    <div id="colleges-loader" class="loader">Chargement…</div>
    <div id="colleges-list" class="college-grid"></div>
  </section>

  <!-- CARD VIEWER -->
  <section id="cards-section">
    <button id="back-btn" onclick="goBack()">← Retour aux collèges</button>
    <div id="progress-bar-wrap">
      <div id="progress-text"></div>
      <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
    </div>
    <div id="already-evaluated" class="already-evaluated" style="display:none"></div>
    <div class="flash-card-box" id="flash-card-box" onclick="revealVerse()">
      <span id="rang-badge" class="badge"></span>
      <span id="low-conf-badge" class="low-conf-badge" style="display:none">⚠ Qualité OCR faible</span>
      <div id="card-type-label" class="card-type-label"></div>
      <div id="card-recto" class="card-recto"></div>
      <div id="card-verso" class="card-verso hidden"></div>
      <div id="reveal-hint">Cliquez pour révéler la réponse</div>
    </div>
    <div class="feedback-actions" id="feedback-actions" style="display:none">
      <button class="btn-not-pertinent" onclick="sendFeedback(false)">✗ Non pertinente</button>
      <button class="btn-pertinent" onclick="sendFeedback(true)">✓ Pertinente</button>
      <button class="btn-skip" onclick="nextCard()">Passer</button>
    </div>
    <div style="margin-top:20px; text-align:center">
      <button class="btn-skip" onclick="showSummary()" style="font-size:.8rem">Voir le résumé →</button>
    </div>
  </section>

  <!-- SUMMARY -->
  <section id="summary-section">
    <button id="back-btn-summary" onclick="showCards()" style="background:transparent; border:none; color:#1b6b3a; font-size:.875rem; cursor:pointer; margin-bottom:16px; padding:0">← Retour aux fiches</button>
    <h2 style="font-size:1.1rem; margin-bottom:16px">Résumé par item</h2>
    <div id="summary-loader" class="loader">Chargement…</div>
    <div id="summary-content"></div>
  </section>

</main>

<script>
  // ─── State ───────────────────────────────────────────────────────────────────
  let creds = null; // {username, password}
  let currentCollegeId = null;
  let allCards = []; // flat list of {card_id, rang, card_type, recto, verso, low_confidence, ocr_confidence_score, feedback}
  let currentIdx = 0;

  // ─── Auth helpers ────────────────────────────────────────────────────────────
  function basicHeader() {
    return "Basic " + btoa(creds.username + ":" + creds.password);
  }

  async function apiFetch(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: { "Authorization": basicHeader(), "Content-Type": "application/json", ...(options.headers || {}) },
    });
    return res;
  }

  // ─── Navigation ──────────────────────────────────────────────────────────────
  function showSection(id) {
    document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function logout() {
    creds = null;
    currentCollegeId = null;
    allCards = [];
    currentIdx = 0;
    document.getElementById("logout-btn").style.display = "none";
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    showSection("login-section");
  }

  function goBack() {
    showSection("colleges-section");
  }

  function showCards() {
    showSection("cards-section");
  }

  // ─── Login ────────────────────────────────────────────────────────────────────
  async function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const errEl = document.getElementById("login-error");
    const btn = document.getElementById("login-btn");

    if (!username || !password) {
      errEl.textContent = "Veuillez saisir vos identifiants.";
      errEl.style.display = "block";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Connexion…";
    errEl.style.display = "none";

    creds = { username, password };
    const res = await fetch("/v1/tester/colleges", {
      headers: { "Authorization": basicHeader() },
    });

    if (res.status === 401) {
      errEl.textContent = "Identifiants incorrects.";
      errEl.style.display = "block";
      creds = null;
      btn.disabled = false;
      btn.textContent = "Se connecter";
      return;
    }

    if (!res.ok) {
      errEl.textContent = "Erreur serveur. Veuillez réessayer.";
      errEl.style.display = "block";
      creds = null;
      btn.disabled = false;
      btn.textContent = "Se connecter";
      return;
    }

    btn.disabled = false;
    btn.textContent = "Se connecter";
    document.getElementById("logout-btn").style.display = "block";
    showSection("colleges-section");
    await loadColleges();
  }

  // Enter key on password field
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("password").addEventListener("keydown", e => {
      if (e.key === "Enter") login();
    });
  });

  // ─── Colleges ────────────────────────────────────────────────────────────────
  async function loadColleges() {
    const loader = document.getElementById("colleges-loader");
    const list = document.getElementById("colleges-list");
    loader.style.display = "block";
    list.innerHTML = "";

    const res = await apiFetch("/v1/tester/colleges");
    loader.style.display = "none";

    if (!res.ok) { list.innerHTML = '<p class="error-msg">Erreur de chargement.</p>'; return; }
    const json = await res.json();

    if (json.total === 0) {
      list.innerHTML = '<div class="empty-state"><h3>Aucun collège disponible</h3><p>Les fiches doivent être générées avant l\'évaluation.</p></div>';
      return;
    }

    json.data.forEach(college => {
      const pct = college.card_count > 0 ? Math.round(college.feedback_count / college.card_count * 100) : 0;
      const div = document.createElement("div");
      div.className = "college-card";
      div.innerHTML = `
        <div>
          <h3>Collège ${college.college_ref_id}</h3>
          <p>${college.feedback_count} / ${college.card_count} fiches évaluées</p>
        </div>
        <span class="badge ${pct === 100 ? 'badge-green' : 'badge-grey'}">${pct}%</span>
      `;
      div.onclick = () => openCollege(college.college_id);
      list.appendChild(div);
    });
  }

  // ─── Cards ────────────────────────────────────────────────────────────────────
  async function openCollege(collegeId) {
    currentCollegeId = collegeId;
    allCards = [];
    currentIdx = 0;
    showSection("cards-section");
    renderCard(null); // loading state

    const res = await apiFetch(`/v1/tester/colleges/${collegeId}/items`);
    if (!res.ok) { alert("Erreur lors du chargement des fiches."); return; }
    const json = await res.json();

    json.data.items.forEach(item => {
      item.flash_cards.forEach(card => {
        allCards.push(card);
      });
    });

    if (allCards.length === 0) {
      document.getElementById("flash-card-box").innerHTML = '<div class="empty-state"><h3>Aucune fiche</h3><p>Ce collège n\'a pas encore de fiches générées.</p></div>';
      return;
    }

    // Start at first un-evaluated card if possible
    const firstPending = allCards.findIndex(c => c.feedback === null);
    currentIdx = firstPending >= 0 ? firstPending : 0;
    renderCard(allCards[currentIdx]);
  }

  function renderCard(card) {
    if (!card) {
      document.getElementById("flash-card-box").innerHTML = '<div class="loader">Chargement…</div>';
      return;
    }

    const total = allCards.length;
    const evaluated = allCards.filter(c => c.feedback !== null).length;
    document.getElementById("progress-text").textContent = `${evaluated} / ${total} fiches évaluées`;
    document.getElementById("progress-fill").style.width = total > 0 ? (evaluated / total * 100) + "%" : "0%";

    document.getElementById("already-evaluated").style.display = "none";
    if (card.feedback !== null) {
      const label = card.feedback.is_pertinent ? "✓ Pertinente" : "✗ Non pertinente";
      const color = card.feedback.is_pertinent ? "#1b6b3a" : "#ba1a1a";
      const alreadyEl = document.getElementById("already-evaluated");
      alreadyEl.style.display = "block";
      alreadyEl.style.borderColor = color;
      alreadyEl.style.background = card.feedback.is_pertinent ? "#f0faf4" : "#fff5f5";
      alreadyEl.style.color = color;
      alreadyEl.textContent = `Déjà évaluée : ${label} — vous pouvez modifier l'évaluation.`;
    }

    const rangClass = "rang-" + card.rang;
    document.getElementById("rang-badge").className = "badge " + rangClass;
    document.getElementById("rang-badge").textContent = "Rang " + card.rang;

    document.getElementById("low-conf-badge").style.display = card.low_confidence ? "block" : "none";
    document.getElementById("card-type-label").textContent = card.card_type === "definition" ? "Fiche définition" : "Flashcard";
    document.getElementById("card-recto").textContent = card.recto;

    const versoEl = document.getElementById("card-verso");
    versoEl.textContent = card.verso;
    versoEl.classList.add("hidden");
    document.getElementById("reveal-hint").style.display = "block";
    document.getElementById("feedback-actions").style.display = "none";
  }

  function revealVerse() {
    const versoEl = document.getElementById("card-verso");
    if (versoEl.classList.contains("hidden")) {
      versoEl.classList.remove("hidden");
      document.getElementById("reveal-hint").style.display = "none";
      document.getElementById("feedback-actions").style.display = "flex";
    }
  }

  async function sendFeedback(isPertinent) {
    if (allCards.length === 0) return;
    const card = allCards[currentIdx];

    const res = await apiFetch(`/v1/tester/flash-cards/${card.card_id}/feedback`, {
      method: "POST",
      body: JSON.stringify({ is_pertinent: isPertinent }),
    });

    if (!res.ok) { alert("Erreur lors de l'enregistrement du feedback."); return; }

    // Update local state
    allCards[currentIdx].feedback = { is_pertinent: isPertinent, tester_id: creds.username, created_at: new Date().toISOString() };
    nextCard();
  }

  function nextCard() {
    if (allCards.length === 0) return;
    // Find next un-evaluated card after current
    let next = -1;
    for (let i = currentIdx + 1; i < allCards.length; i++) {
      if (allCards[i].feedback === null) { next = i; break; }
    }
    if (next === -1) {
      // Wrap around from beginning
      for (let i = 0; i < currentIdx; i++) {
        if (allCards[i].feedback === null) { next = i; break; }
      }
    }
    if (next === -1) {
      // All evaluated — hide controls to prevent re-evaluation loop
      document.getElementById("feedback-actions").style.display = "none";
      document.getElementById("reveal-hint").style.display = "none";
      alert("Toutes les fiches ont été évaluées ! Consultez le résumé.");
      return;
    }
    currentIdx = next;
    renderCard(allCards[currentIdx]);
  }

  // ─── Summary ──────────────────────────────────────────────────────────────────
  async function showSummary() {
    showSection("summary-section");
    const loader = document.getElementById("summary-loader");
    const content = document.getElementById("summary-content");
    loader.style.display = "block";
    content.innerHTML = "";

    const res = await apiFetch(`/v1/tester/colleges/${currentCollegeId}/summary`);
    loader.style.display = "none";

    if (!res.ok) { content.innerHTML = '<p class="error-msg">Erreur de chargement.</p>'; return; }
    const json = await res.json();

    let html = '<table><thead><tr><th>#</th><th>Rang</th><th>Total</th><th>Pertinentes</th><th>Non pertinentes</th><th>En attente</th></tr></thead><tbody>';
    json.data.items.forEach(item => {
      const evaluated = item.pertinent_count + item.not_pertinent_count;
      const pct = evaluated > 0 ? Math.round(item.pertinent_count / evaluated * 100) : 0;
      html += `<tr>
        <td>${item.item_number}</td>
        <td><span class="badge rang-${item.rang}">Rang ${item.rang}</span></td>
        <td>${item.total_cards}</td>
        <td class="pct">${item.pertinent_count}</td>
        <td style="color:#ba1a1a; font-weight:600">${item.not_pertinent_count}</td>
        <td>${item.pending_count}</td>
      </tr>`;
    });
    html += "</tbody></table>";
    content.innerHTML = html;
  }
</script>

</body>
</html>
