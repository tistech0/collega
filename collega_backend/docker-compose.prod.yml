services:
  migrate:
    image: tistech0/collega-backend:${IMAGE_TAG:?IMAGE_TAG manquant dans .env (deploy.sh le pose)}
    command: alembic upgrade head
    env_file: .env
    environment:
      # Redis protégé par mot de passe (chantier 3) : REDIS_PASSWORD vient du .env du NAS,
      # cette valeur surcharge le REDIS_URL historique du .env (jamais réécrit).
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - collega_net
    restart: "no"

  api:
    image: tistech0/collega-backend:${IMAGE_TAG:?IMAGE_TAG manquant dans .env (deploy.sh le pose)}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - pdf_storage:/tmp/collega_pdfs
      # Clé APNs (.p8, uid 1000, mode 400) : APNS_KEY_PATH=/run/secrets/collega/AuthKey_<id>.p8.
      - /mnt/user/appdata/collega/secrets:/run/secrets/collega:ro
    # Pas de "ports:" : NPM joint l'API par son nom (collega-api-1) sur net-edge, le réseau
    # de NPM et cloudflared (port 430 retiré le 2026-08-14). Un `docker network connect` de
    # NPM sur collega_net sautait à chaque recréation de NPM par Unraid (502, 2026-10-02).
    env_file: .env
    environment:
      # Redis protégé par mot de passe (chantier 3) : REDIS_PASSWORD vient du .env du NAS,
      # cette valeur surcharge le REDIS_URL historique du .env (jamais réécrit).
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}@redis:6379/0
    healthcheck:
      # /health vérifie Postgres et Redis ; urlopen lève sur un 503 → exit ≠ 0.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    logging: &logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - collega_net
      - net-edge
    restart: unless-stopped

  worker:
    image: tistech0/collega-backend:${IMAGE_TAG:?IMAGE_TAG manquant dans .env (deploy.sh le pose)}
    command: arq app.workers.settings.WORKER_SETTINGS
    volumes:
      - pdf_storage:/tmp/collega_pdfs
      # Clé APNs (.p8, uid 1000, mode 400) : APNS_KEY_PATH=/run/secrets/collega/AuthKey_<id>.p8.
      - /mnt/user/appdata/collega/secrets:/run/secrets/collega:ro
    env_file: .env
    environment:
      # Redis protégé par mot de passe (chantier 3) : REDIS_PASSWORD vient du .env du NAS,
      # cette valeur surcharge le REDIS_URL historique du .env (jamais réécrit).
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}@redis:6379/0
    healthcheck:
      # La clé de santé arq est rafraîchie toutes les health_check_interval (60 s).
      test: ["CMD", "arq", "--check", "app.workers.settings.WORKER_SETTINGS"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    # OCR de PDF jusqu'à 500 Mo : borne pour ne pas affamer les autres services du NAS.
    mem_limit: 4g
    logging: *logging
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - collega_net
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    # NE PAS ajouter "ports:" — accès interne uniquement via le network collega_net.
    # L'API se connecte via DATABASE_URL=postgresql+asyncpg://postgres:...@db:5432/collega.
    volumes:
      - /mnt/user/appdata/collega/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: collega
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - collega_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # NE PAS ajouter "ports:" — accès interne uniquement via le network collega_net.
    # Mot de passe obligatoire ; l'API/worker se connectent via le REDIS_URL surchargé ci-dessus.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env} --appendonly yes
    environment:
      # redis-cli s'authentifie tout seul (healthcheck, docker exec … redis-cli) sans
      # mettre le mot de passe en argument visible.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - /mnt/user/appdata/collega/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - collega_net
    restart: unless-stopped

volumes:
  pdf_storage:
    driver: local
    driver_opts:
      type: none
      device: /mnt/user/appdata/collega/pdfs
      o: bind

networks:
  collega_net:
    driver: bridge
  # Réseau d'Unraid (NPM, cloudflared), créé hors de ce stack.
  net-edge:
    external: true
